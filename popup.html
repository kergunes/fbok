<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>fbok settings</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>fbok</h1>
      <p class="subtitle">Facebook feed controls</p>

      <label class="setting" for="suggested-toggle">
        <span>
          <strong>Hide suggested posts</strong>
          <small>Posts Facebook recommends from pages and groups</small>
        </span>
        <input id="suggested-toggle" type="checkbox">
      </label>

      <label class="setting" for="debug-toggle">
        <span>
          <strong>Show debug info</strong>
          <small>Display scan counters on Facebook pages</small>
        </span>
        <input id="debug-toggle" type="checkbox">
      </label>

      <p id="status" role="status" aria-live="polite"></p>
      <p class="locked">Sponsored posts and medium-confidence candidates are always hidden.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
